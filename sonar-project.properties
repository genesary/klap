# SonarQube Cloud analysis configuration.
# The project must first be created on https://sonarcloud.io and bound to this
# repository, then the SONAR_TOKEN secret must be added to the GitHub repository.
sonar.projectKey=Ripolin_klap
sonar.organization=ripolin
sonar.projectName=klap

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Build outputs and generated code carry no reviewable quality signal.
sonar.exclusions=bin/**,dist/**,**/zz_generated.*.go,test/mock_ldap/**

# Coverage is produced by `make test`, which excludes the e2e suite. Wiring-only
# packages (cmd) and API type definitions are not meaningfully coverable either.
sonar.go.coverage.reportPaths=cover.out
sonar.coverage.exclusions=cmd/**,api/**,test/**

# Test suites intentionally repeat setup blocks; mirrors the `dupl` exclusions
# already declared in .golangci.yml.
sonar.cpd.exclusions=**/*_test.go

# Issues found by the project's own golangci-lint run, imported as external
# issues (checkstyle format, produced by `make lint-report`).
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml
